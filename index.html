         BASIC SEO

<meta name="google-site-verification" content="VLnGCSaRGEwSwS-inRk2UyU9A_zjksU989qMh4WI2cY" />
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#09335A"
    />

    <meta
      name="description"
      content="Shop premium men's and women's fashion at Orbit Buy. Discover stylish clothing, trendy collections, quality apparel and the latest fashion for every occasion."
    />

    <meta
      name="keywords"
      content="Orbit Buy, men's fashion, women's fashion, men's clothing, women's clothing, online fashion store, premium fashion, trendy clothes, men's shirts, men's t-shirts, men's jeans, men's jackets, women's dresses, women's shirts, women's jeans, women's formal wear, women's party wear, online clothing store"
    />

    <meta
      name="author"
      content="Orbit Buy"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL URL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://orbitbuy.vercel.app/"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"

    <title>

    <meta
      property="og:site_name"

      name="twitter:title"

    <!-- =====================================================
         STRUCTURED DATA — WEBSITE
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Orbit Buy",
        "alternateName": "Orbit Buy Fashion",
        "url": "https://orbitbuy.vercel.app/",
        "description": "Premium online fashion store for men's and women's clothing.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://orbitbuy.vercel.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA — ORGANIZATION
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Orbit Buy",
        "url": "https://orbitbuy.vercel.app/",
        "logo": "https://orbitbuy.vercel.app/favicon.svg",
        "description": "Orbit Buy is a premium online fashion store for men and women."
      }
    </script>

            "url": "https://orbitbuy.vercel.app/best-sellers"

          {
            "@type": "ListItem",
            "position": 5,

          },
          {
            "@type": "ListItem",
