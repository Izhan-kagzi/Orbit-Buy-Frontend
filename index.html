<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC SEO
    ====================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09335A" />
    <meta name="description" content="Shop premium men's and women's fashion at Orbit Buy. Discover stylish clothing, trendy collections, quality apparel and the latest fashion for every occasion." />
    <meta name="keywords" content="Orbit Buy, men's fashion, women's fashion, men's clothing, women's clothing, online fashion store, premium fashion, trendy clothes, men's shirts, men's t-shirts, men's jeans, men's jackets, women's dresses, women's shirts, women's jeans, women's formal wear, women's party wear, online clothing store" />
    <meta name="author" content="Orbit Buy" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- =====================================================
         CANONICAL URL
    ====================================================== -->
    <link rel="canonical" href="https://orbitbuy.vercel.app/" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->
    <link rel="icon" type="image/svg+xml" href="/orbit_buy_logo.svg" />
    <link rel="apple-touch-icon" href="/orbit_buy_logo.svg" />

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Playfair+Display:wght@500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- =====================================================
         PAGE TITLE
    ====================================================== -->
    <title>Orbit Buy | Premium Fashion for Men & Women</title>

    <!-- =====================================================
         OPEN GRAPH / FACEBOOK / WHATSAPP / LINK PREVIEWS
    ====================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit Buy" />
    <meta property="og:url" content="https://orbitbuy.vercel.app/" />
    <meta property="og:title" content="Orbit Buy | Premium Fashion for Men & Women" />
    <meta property="og:description" content="Discover premium men's and women's fashion at Orbit Buy. Shop stylish clothing, quality apparel and the latest trends." />
    <meta property="og:image" content="https://orbitbuy.vercel.app/og-image.jpg" />
    <meta property="og:image:alt" content="Orbit Buy - Premium Fashion for Men and Women" />
    <meta property="og:locale" content="en_IN" />

    <!-- =====================================================
         TWITTER / X CARD
    ====================================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbit Buy | Premium Fashion for Men & Women" />
    <meta name="twitter:description" content="Discover premium men's and women's fashion at Orbit Buy. Shop stylish clothing and the latest fashion trends." />
    <meta name="twitter:image" content="https://orbitbuy.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Orbit Buy Premium Fashion for Men and Women" />

    <!-- =====================================================
         STRUCTURED DATA — WEBSITE
    ====================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Orbit Buy",
        "alternateName": "Orbit Buy Fashion",
        "url": "https://orbitbuy.vercel.app/",
        "description": "Premium online fashion store for men's and women's clothing.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://orbitbuy.vercel.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA — ORGANIZATION
    ====================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Orbit Buy",
        "url": "https://orbitbuy.vercel.app/",
        "logo": "https://orbitbuy.vercel.app/orbit_buy_logo.svg",
        "sameAs": [
          "https://www.facebook.com/orbitbuy",
          "https://www.instagram.com/orbitbuy",
          "https://twitter.com/orbitbuy"
        ],
        "description": "Orbit Buy is a premium online fashion store for men and women."
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA — BREADCRUMB
    ====================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://orbitbuy.vercel.app/" },
          { "@type": "ListItem", "position": 2, "name": "Men's Fashion", "item": "https://orbitbuy.vercel.app/mens-fashion" },
          { "@type": "ListItem", "position": 3, "name": "Women's Fashion", "item": "https://orbitbuy.vercel.app/womens-fashion" }
        ]
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA — FAQ
    ====================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does Orbit Buy offer free shipping?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Orbit Buy offers free shipping on orders above ₹999 across India."
            }
          },
          {
            "@type": "Question",
            "name": "Can I return products?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Orbit Buy allows returns within 7 days of delivery for unused items."
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
